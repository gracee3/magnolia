name: Phase 2 shell proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase-2-shell.yml"
      - "Cargo.toml"
      - "README.md"
      - "AGENTS.md"
      - "apps/magnolia-desktop/**"
      - "crates/magnolia-application/**"
      - "crates/magnolia-client/**"
      - "crates/magnolia-domain/**"
      - "crates/magnolia-protocol/**"
      - "crates/magnolia-studio-web/**"
      - "docs/**"
      - "scripts/**"
      - "tests/e2e/**"
  workflow_dispatch:

concurrency:
  group: phase-2-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install explicit verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          cargo install trunk --version 0.21.14 --locked

      - name: Install browser harness and Chromium
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run foundation, shell, WASM, Trunk, and Chromium gates
        run: ./scripts/verify.sh

      - name: Upload Chromium diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-playwright-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            tests/e2e/test-results/
            tests/e2e/playwright-report/
