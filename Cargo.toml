[workspace]
resolver = "2"
members = [
    "crates/magnolia-domain",
    "crates/magnolia-protocol",
    "crates/magnolia-client",
    "crates/magnolia-application",
    "crates/magnolia-runtime",
    "apps/magnolia-desktop",
    "crates/magnolia-studio-web",
]

default-members = [
    "apps/magnolia-desktop",
]

[workspace.dependencies]
base64 = "0.22"
event-listener = "5.4"
futures = "0.3"
getrandom = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
hex = "0.4"
js-sys = "0.3"
leptos = { version = "0.8.20", features = ["csr"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
send_wrapper = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
