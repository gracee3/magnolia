[package]
name = "magnolia-asr"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[features]
default = []
# Enabling this feature requires a separately hash-locked native library and
# SHERPA_ONNX_LIB_DIR. Normal Magnolia builds never fetch native binaries.
sherpa = ["dep:sherpa-onnx", "dep:sherpa-onnx-sys"]

[dependencies]
magnolia-protocol = { path = "../magnolia-protocol" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true
sherpa-onnx = { workspace = true, optional = true }
sherpa-onnx-sys = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
